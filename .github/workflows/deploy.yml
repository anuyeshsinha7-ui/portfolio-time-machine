name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned packages (no yfinance — the workflow never downloads market data)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest cvxpy scikit-learn playwright
      - name: Unit tests and AppTest smoke tests
        run: python -m pytest tests -q
      - name: Precompute results from the committed snapshot
        run: python scripts/precompute.py
      - name: Build the site
        run: python scripts/build_site.py
      - name: Playwright smoke test of _site (landing page, amount hand-off, every page, desktop + phone)
        run: |
          python -m playwright install --with-deps chromium
          python tests/e2e_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
